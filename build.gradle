plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.app'
version = '0.0.1-SNAPSHOT'
description = 'mydata'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencyManagement {
    dependencies {
        // Tomcat CRITICAL 5건 (보안점검 §2-2)
        dependencySet(group: 'org.apache.tomcat.embed', version: '10.1.59') {
            entry 'tomcat-embed-core'
            entry 'tomcat-embed-el'
            entry 'tomcat-embed-websocket'
        }
        // Jackson HIGH 5건 (보안점검 §2-2)
        dependencySet(group: 'com.fasterxml.jackson.core', version: '2.21.7') {
            entry 'jackson-core'
            entry 'jackson-databind'
        }
        // PostgreSQL HIGH 1건 (보안점검 §2-2)
        dependency 'org.postgresql:postgresql:42.7.12'
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // DB - MyBatis + PostgreSQL
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.4'
    runtimeOnly 'org.postgresql:postgresql'

    // 컨테이너 헬스체크용 /actuator/health
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Swagger - 팀원들이 API 스펙 봐야 하니 필수
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2'
}

tasks.named('test') {
    useJUnitPlatform()
}
