name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: '롤백할 이미지 태그(전체 커밋 SHA). 비우면 현재 커밋을 빌드해서 배포'
        required: false
        default: ''

# 같은 저장소의 배포는 한 번에 하나. 저장소끼리 겹치는 건 서버의 flock이 막는다
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  SERVICE: mydata
  IMAGE: ghcr.io/returns-7/mydata

jobs:
  build:
    # 롤백(sha 입력)이면 빌드하지 않는다
    if: ${{ !inputs.sha }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Test
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    # build가 성공했거나(일반 배포) 건너뛰었을 때(롤백)만
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          TAG: ${{ inputs.sha || github.sha }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
        run: |
          # 입력값이 원격 셸 명령에 들어가므로 SHA 형식만 허용
          [[ "$TAG" =~ ^[0-9a-f]{40}$ ]] || { echo "SHA 형식이 아닙니다: $TAG"; exit 1; }

          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key "$SSH_TARGET" "/opt/maria-deploy/app/deploy.sh $SERVICE $TAG"
