server:
  port: 10002

  error:
    whitelabel:
      enabled: false

logging:
  level:
    root: WARN
    com.app.mydata: INFO
    org.mybatis: DEBUG
    org.apache.ibatis: DEBUG

spring:
  config:
    # 비밀값은 프로젝트 루트의 .env에서 읽는다(git 제외)
    # 서버에서는 파일 없이 환경변수로 주입하므로 optional
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10      # 최대 커넥션 수
      minimum-idle: 5            # 최소 유지 커넥션
      connection-timeout: 30000  # 커넥션 획득 대기 시간(ms)
      idle-timeout: 600000       # 유휴 커넥션 유지 시간(ms)

  # DevTools
  devtools:
    restart:
      exclude: "**/domain/**"


# MyBatis
mybatis:
  # Mapper XML 위치
  mapper-locations: classpath:mappers/**/*.xml

  # DTO / VO / Entity alias 패키지
  type-aliases-package: com.app.mydata.domain

  configuration:

    # DB snake_case → Java camelCase
    # ACCOUNT_NO → accountNo
    map-underscore-to-camel-case: true

    # null 처리
    # jdbc-type-for-null: NULL

    # 개발용 SQL 로그
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl


# Swagger / OpenAPI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
  api-docs:
    path: /api-docs

